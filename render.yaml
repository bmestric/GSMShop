services:
  - type: web
    name: gsmshop
    env: docker
    healthCheckPath: /
    envVars:
      # Render injects PORT automatically — app reads it via ${PORT:8081}

      # Database
      # SPRING_DATASOURCE_URL must be set manually in the Render dashboard.
      # Go to the PostgreSQL database → Info → copy "External Database URL",
      # prepend "jdbc:" so it becomes jdbc:postgresql://user:pass@host/db
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: gsmshop-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: gsmshop-db
          property: password

      # Production overrides
      - key: THYMELEAF_CACHE
        value: "true"
      - key: JPA_SHOW_SQL
        value: "false"
      - key: H2_CONSOLE_ENABLED
        value: "false"

      # Secrets — fill these in the Render dashboard after first deploy
      - key: JWT_SECRET
        sync: false        # marks it as a secret — must be set manually in Render UI
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

databases:
  - name: gsmshop-db
    plan: free
    databaseName: gsmshop
    user: gsmshop
