<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Users')}"><title>Admin - Users</title></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container flex-grow-1 py-4">
    <h2 class="mb-4">Manage Users</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.firstName} + ' ' + ${user.lastName}">Name</td>
                <td th:text="${user.email}">email@example.com</td>
                <td>
                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger">Admin</span>
                    <span th:if="${user.role.name() == 'USER'}" class="badge bg-primary">User</span>
                </td>
                <td>
                    <span th:if="${user.active}" class="badge bg-success">Active</span>
                    <span th:if="${!user.active}" class="badge bg-secondary">Inactive</span>
                </td>
                <td>
                    <form th:if="${user.active}"
                          th:action="@{/admin/users/{id}/active(id=${user.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" name="active" value="false">
                        <button type="submit" class="btn btn-outline-warning btn-sm"
                                onclick="return confirm('Deactivate this user?')">
                            <i class="bi bi-person-x"></i> Deactivate
                        </button>
                    </form>
                    <form th:if="${!user.active}"
                          th:action="@{/admin/users/{id}/active(id=${user.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" name="active" value="true">
                        <button type="submit" class="btn btn-outline-success btn-sm">
                            <i class="bi bi-person-check"></i> Activate
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
