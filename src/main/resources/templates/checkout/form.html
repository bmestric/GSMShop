<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Checkout - GSM Shop')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container flex-grow-1 py-4">
    <h2 class="mb-4">Checkout</h2>

    <form th:action="@{/checkout/place}" th:object="${deliveryInfo}" method="post">
        <div class="row">
            <!-- Delivery Details -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header"><h5 class="mb-0">Delivery Information</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Street Address <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{address}" class="form-control"
                                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                                   placeholder="e.g. Ilica 10">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Postal Code <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{postalCode}" class="form-control"
                                       th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid'"
                                       placeholder="10000">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('postalCode')}"
                                     th:errors="*{postalCode}"></div>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">City <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{city}" class="form-control"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"
                                       placeholder="Zagreb">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}"
                                     th:errors="*{city}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Country <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{country}" class="form-control"
                                   th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'"
                                   placeholder="Croatia">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('country')}"
                                 th:errors="*{country}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="tel" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="+385 91 234 5678">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"></div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header"><h5 class="mb-0">Order Items</h5></div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Subtotal</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${cart.items}">
                                <td th:text="${item.productName}">Product</td>
                                <td th:text="${item.quantity}">1</td>
                                <td th:text="'€' + ${item.price}">€0.00</td>
                                <td class="fw-semibold" th:text="'€' + ${item.subtotal}">€0.00</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Payment -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Payment</h5>
                        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                            <span>Total:</span>
                            <span class="text-primary" th:text="'€' + ${cart.total}">€0.00</span>
                        </div>

                        <h6 class="mb-3">Select payment method:</h6>
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod"
                                       id="codRadio" value="COD" checked>
                                <label class="form-check-label" for="codRadio">
                                    <i class="bi bi-cash-stack"></i> Cash on Delivery
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentMethod"
                                       id="paypalRadio" value="PAYPAL">
                                <label class="form-check-label" for="paypalRadio">
                                    <i class="bi bi-paypal"></i> PayPal
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 mb-2">
                            <i class="bi bi-bag-check"></i> Place Order
                        </button>
                        <a th:href="@{/cart}" class="btn btn-outline-secondary w-100">
                            Back to Cart
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
