spring.application.name=gsmShop

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/gsmshopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ThisIsTest1!}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}


app.jwt.secret=${JWT_SECRET:local-dev-insecure-key-change-before-deploy}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=https://api-m.sandbox.paypal.com
